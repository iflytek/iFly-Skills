[project]
name = "ifly-skills-coze"
version = "0.1.0"
description = "Shared backend for iFly-Skills Coze API plugins"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "uvicorn>=0.32,<1",
    "requests>=2.32,<3",
    "websocket-client>=1.8,<2",
    "pillow>=11,<13",
    "pypdfium2>=4.30,<6",
    "python-docx>=1.1,<2",
    "mutagen>=1.47,<2",
]

[dependency-groups]
dev = [
    "httpx2>=2.13,<3",
    "pytest>=8.3,<10",
    "openapi-spec-validator>=0.7.2,<0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
