name: Python Check

on:
  pull_request:
    paths:
      - 'tests/iflytek_voiceclone_tts/**'
      - 'tests/iflytek_speed_transcription/**'
      - "skills/**/*.py"
  push:
    branches: [main]
    paths:
      - 'tests/iflytek_voiceclone_tts/**'
      - 'tests/iflytek_speed_transcription/**'
      - "skills/**/*.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Python check dependencies
        run: pip install ruff==0.16.2 -r tests/iflytek_speed_transcription/requirements.txt

      - name: Check Python
        run: |
          python -m compileall -q skills tests
          ruff check --select=E9,F63,F7,F82 skills tests

      - name: Run Speed Transcription offline regression tests
        run: python -m unittest discover -s tests/iflytek_speed_transcription -p 'test_*.py' -v

      - name: Run Voice Clone TTS offline regression tests
        run: python -m unittest discover -s tests/iflytek_voiceclone_tts -p 'test_*.py' -v
