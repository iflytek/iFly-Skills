name: Coze checks

on:
  pull_request:
    paths:
      - 'integrations/coze/**'
      - '.github/workflows/coze-check.yml'
  push:
    branches: [main]
    paths:
      - 'integrations/coze/**'
      - '.github/workflows/coze-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Coze tests (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.1'
          python-version: '3.13'
          enable-cache: false

      - name: Run locked Coze tests
        run: uv run --locked --project integrations/coze --python 3.13 pytest integrations/coze/tests
