version: 2
updates:
  - package-ecosystem: npm
    directory: /packages/n8n-nodes-iflytek
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps(n8n)'
  - package-ecosystem: npm
    directory: /packages/n8n-nodes-iflytek/tests/host
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      n8n-host:
        patterns: ['n8n', 'n8n-workflow']
    commit-message:
      prefix: 'deps(n8n-host)'
  # GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"

  # Python (pip) dependency updates for skills
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      dev-deps:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
